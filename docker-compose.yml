services:
  postgres:
    image: postgres:16-alpine
    container_name: mai-corrosion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mai_corrosion}
      POSTGRES_USER: ${POSTGRES_USER:-mai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-use}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mai-api:
    build:
      context: .
      args:
        UID: ${MAI_UID:-1000}
        GID: ${MAI_GID:-1000}
    container_name: mai-corrosion-api
    restart: unless-stopped
    # Every variable of .env reaches the API (documents, OCR, MAI_SOURCE_<ID>_URL of a new source
    # profile…); the explicit list below sets container paths and defaults and takes precedence.
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MAI_DATABASE_URL: ${MAI_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-mai}:${POSTGRES_PASSWORD:-change-me-before-use}@postgres:5432/${POSTGRES_DB:-mai_corrosion}}
      MAI_COX_MODEL_PATH: /app/models/cox_model.json
      MAI_SOURCE_PROFILES_PATH: /app/config/source_profiles.json
      MAI_SOURCE_TIMEZONE: ${MAI_SOURCE_TIMEZONE:-Europe/Moscow}
      MAI_MAX_FORWARD_FILL_DAYS: ${MAI_MAX_FORWARD_FILL_DAYS:-7}
      MAI_MAX_TELEMETRY_AGE_HOURS: ${MAI_MAX_TELEMETRY_AGE_HOURS:-48}
      MAI_MIN_TELEMETRY_RECORDS: ${MAI_MIN_TELEMETRY_RECORDS:-8}
      MAI_MIN_TREND_OBSERVATIONS: ${MAI_MIN_TREND_OBSERVATIONS:-8}
      MAI_TREND_WINDOW_DAYS: ${MAI_TREND_WINDOW_DAYS:-28}
      MAI_MIN_CURRENT_SIGNALS: ${MAI_MIN_CURRENT_SIGNALS:-2}
      MAI_MAX_EXCEL_BYTES: ${MAI_MAX_EXCEL_BYTES:-15728640}
      MAI_MAX_EXCEL_ROWS: ${MAI_MAX_EXCEL_ROWS:-10000}
      MAI_WELL_IDS: ${MAI_WELL_IDS:-}
      MAI_ALERT_RULE_CLASSES: ${MAI_ALERT_RULE_CLASSES:-HIGH,CRITICAL}
      MAI_ALERT_PROBABILITY_THRESHOLD: ${MAI_ALERT_PROBABILITY_THRESHOLD:-0.7}
      MAI_DASHBOARD_URL: ${MAI_DASHBOARD_URL:-http://localhost:8000/dashboard}
      MAI_API_KEY: ${MAI_API_KEY:-}
      MAI_LLM_API_URL: ${MAI_LLM_API_URL:-}
      MAI_LLM_API_KEY: ${MAI_LLM_API_KEY:-}
      MAI_LLM_MODEL: ${MAI_LLM_MODEL:-}
      MAI_LLM_TIMEOUT_SECONDS: ${MAI_LLM_TIMEOUT_SECONDS:-45}
      MAI_LLM_MAX_RETRIES: ${MAI_LLM_MAX_RETRIES:-1}
      # Documents: OCR model and extraction model through the same LiteLLM (empty = MAI_LLM_*).
      MAI_OCR_MODEL: ${MAI_OCR_MODEL:-}
      MAI_OCR_API_URL: ${MAI_OCR_API_URL:-}
      MAI_OCR_API_KEY: ${MAI_OCR_API_KEY:-}
      MAI_OCR_TIMEOUT_SECONDS: ${MAI_OCR_TIMEOUT_SECONDS:-120}
      MAI_DOCS_LLM_MODEL: ${MAI_DOCS_LLM_MODEL:-}
      MAI_DOCS_STORAGE_DIR: /app/data/documents
      MAI_DOCS_INBOX_DIR: /app/inbox
      MAI_DOCS_INBOX_SCAN_SECONDS: ${MAI_DOCS_INBOX_SCAN_SECONDS:-300}
      MAI_DOCS_MAX_BYTES: ${MAI_DOCS_MAX_BYTES:-26214400}
      MAI_DOCS_MAX_PAGES: ${MAI_DOCS_MAX_PAGES:-30}
      MAI_SOURCE_DARS_URL: ${MAI_SOURCE_DARS_URL:-}
      MAI_SOURCE_DARS_TOKEN: ${MAI_SOURCE_DARS_TOKEN:-}
      MAI_SOURCE_KHIMIK_URL: ${MAI_SOURCE_KHIMIK_URL:-}
      MAI_SOURCE_KHIMIK_TOKEN: ${MAI_SOURCE_KHIMIK_TOKEN:-}
      MAI_SOURCE_ERA_URL: ${MAI_SOURCE_ERA_URL:-}
      MAI_SOURCE_ERA_TOKEN: ${MAI_SOURCE_ERA_TOKEN:-}
      MAI_SOURCE_CREW_SCHEDULE_URL: ${MAI_SOURCE_CREW_SCHEDULE_URL:-}
      MAI_SOURCE_CREW_SCHEDULE_TOKEN: ${MAI_SOURCE_CREW_SCHEDULE_TOKEN:-}
      MAI_ANALYSIS_RETENTION_DAYS: ${MAI_ANALYSIS_RETENTION_DAYS:-90}
      MAI_MAX_FUTURE_SKEW_HOURS: ${MAI_MAX_FUTURE_SKEW_HOURS:-24}
      MAI_SOURCE_REFRESH_WORKERS: ${MAI_SOURCE_REFRESH_WORKERS:-4}
      MAI_SOURCE_MAX_RETRIES: ${MAI_SOURCE_MAX_RETRIES:-2}
      MAI_RATING_COMBINE: ${MAI_RATING_COMBINE:-max}
      MAI_RATING_REPAIR_FROM: ${MAI_RATING_REPAIR_FROM:-80}
      MAI_RATING_UD_FROM: ${MAI_RATING_UD_FROM:-40}
      MAI_RATING_UD_TO: ${MAI_RATING_UD_TO:-60}
      MAI_RATING_DAYS_REPAIR: ${MAI_RATING_DAYS_REPAIR:-14}
      MAI_RATING_DAYS_ENGINEER: ${MAI_RATING_DAYS_ENGINEER:-30}
      MAI_RATING_DAYS_UD: ${MAI_RATING_DAYS_UD:-45}
      MAI_RATING_HORIZON_DAYS: ${MAI_RATING_HORIZON_DAYS:-90}
      MAI_RATING_SAMPLING_DAYS: ${MAI_RATING_SAMPLING_DAYS:-30}
      MAI_RATING_ACT_DAYS: ${MAI_RATING_ACT_DAYS:-365}
      MAI_RATING_RECOMPUTE_SYNC_LIMIT: ${MAI_RATING_RECOMPUTE_SYNC_LIMIT:-50}
      MAI_RATING_PROTECTION_MODE: ${MAI_RATING_PROTECTION_MODE:-adjust}
      MAI_RATING_PROTECTION_FACTOR: ${MAI_RATING_PROTECTION_FACTOR:-0.5}
      MAI_RATING_PROTECTION_MIN_INHIBITOR: ${MAI_RATING_PROTECTION_MIN_INHIBITOR:-0.80}
      MAI_RATING_PROTECTION_MAX_INJECTION_DEV: ${MAI_RATING_PROTECTION_MAX_INJECTION_DEV:-15}
      MAI_RATING_PROTECTION_MAX_RATE: ${MAI_RATING_PROTECTION_MAX_RATE:-0.1}
      MAI_PROMINE_TRANSPORT: ${MAI_PROMINE_TRANSPORT:-none}
      MAI_PROMINE_EMAIL_TO: ${MAI_PROMINE_EMAIL_TO:-}
      MAI_PROMINE_API_URL: ${MAI_PROMINE_API_URL:-}
      MAI_PROMINE_API_TOKEN: ${MAI_PROMINE_API_TOKEN:-}
      MAI_PROMINE_TIMEOUT_SECONDS: ${MAI_PROMINE_TIMEOUT_SECONDS:-20}
      MAI_SMTP_HOST: ${MAI_SMTP_HOST:-}
      MAI_SMTP_PORT: ${MAI_SMTP_PORT:-587}
      MAI_SMTP_SECURITY: ${MAI_SMTP_SECURITY:-starttls}
      MAI_SMTP_USER: ${MAI_SMTP_USER:-}
      MAI_SMTP_PASSWORD: ${MAI_SMTP_PASSWORD:-}
      MAI_SMTP_FROM: ${MAI_SMTP_FROM:-}
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
      # Drop Excel / PDF / scans into ./inbox; taken files move to ./inbox/processed or ./inbox/failed.
      - ${MAI_DOCS_INBOX_HOST_DIR:-./inbox}:/app/inbox
      - documents_data:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.40.7}
    container_name: mai-corrosion-n8n
    restart: unless-stopped
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:${N8N_HOST_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: mai_n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-mai}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-use}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Moscow}
      TZ: ${TZ:-Europe/Moscow}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      mai-api:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
  documents_data:
