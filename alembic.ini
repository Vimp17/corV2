# Alembic configuration. The application runs `upgrade head` itself on startup (see
# app/db.py:init_db), so manual use is only needed for inspection or downgrades:
#   alembic current | alembic history | alembic upgrade head
# The database URL comes from MAI_DATABASE_URL (or .env), not from this file.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
